# Local-only preview. Production deployment uses docker-compose.yml by itself.
# docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.local.yml -p devshare-local up -d --build
services:
  application:
    environment:
      ALLOWED_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
      METRICS_TOKEN: local-preview-metrics-only
      # Plain-HTTP preview: the session cookie cannot be Secure here.
      COOKIE_SECURE: "0"
      # Browser tests create many accounts from one address.
      AUTH_SIGNUP_PER_HOUR: "500"
      AUTH_SIGNIN_PER_15MIN: "500"
  caddy:
    ports: !override
      - "127.0.0.1:8080:80"
    environment:
      DOMAIN: ":80"
