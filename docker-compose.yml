services:
  application:
    build:
      context: .
      target: application
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_PATH: /data/devshare.sqlite
      ALLOWED_ORIGINS: https://${DOMAIN:?Set DOMAIN in .env}
      TRUST_PROXY: "1"
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      NODE_OPTIONS: --max-old-space-size=384
    volumes:
      - sqlite_data:/data
    mem_limit: 512m
    cpus: 1.5
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  caddy:
    build:
      context: .
      target: web
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      application:
        condition: service_healthy
    mem_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  sqlite_data:
  caddy_data:
  caddy_config:
