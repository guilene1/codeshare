services:
  application:
    build:
      context: .
      target: application
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_PATH: /data/devshare.sqlite
      # The previous domain stays an allowed origin (harmless once it only redirects).
      ALLOWED_ORIGINS: https://${DOMAIN:?Set DOMAIN in .env},https://${LEGACY_DOMAIN:?Set LEGACY_DOMAIN in .env}
      TRUST_PROXY: "1"
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      NODE_OPTIONS: --max-old-space-size=384
    volumes:
      - sqlite_data:/data
    mem_limit: 512m
    cpus: 1.5
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  caddy:
    build:
      context: .
      target: web
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
      WWW_DOMAIN: ${WWW_DOMAIN:?Set WWW_DOMAIN in .env}
      LEGACY_DOMAIN: ${LEGACY_DOMAIN:?Set LEGACY_DOMAIN in .env}
      # "app" keeps the previous domain serving; "legacy_redirect" redirects it to DOMAIN.
      LEGACY_MODE: ${LEGACY_MODE:-legacy_redirect}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      application:
        condition: service_healthy
    mem_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  sqlite_data:
  caddy_data:
  caddy_config:
